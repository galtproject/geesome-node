server {
    listen 80;
    
    root %app_dir%;
    index index.html index.htm index.nginx-debian.html;
    server_name %app_domain%;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /.well-known/geesome { proxy_pass http://127.0.0.1:2052/.well-known/geesome; }
    location /api/ {
        client_max_body_size 2000m;
        proxy_pass http://127.0.0.1:2052/;
    }
    
    location /.well-known/ {
        alias /var/www/%app_domain%/.well-known/;
    }
}

server {
    listen 80;

    root %app_dir%;
    index index.html index.htm index.nginx-debian.html;
    server_name gateway.%app_domain%;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /.well-known/geesome { proxy_pass http://127.0.0.1:2052/.well-known/geesome; }

    location /.well-known/ {
        alias /var/www/gateway.%app_domain%/.well-known/;
    }
}
