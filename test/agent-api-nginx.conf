events {}
http {
	server {
		listen 80;
		client_max_body_size 2000m;
		resolver 127.0.0.11 valid=1s;
		set $api_upstream test:7772;
		location = /.well-known/geesome { proxy_pass http://$api_upstream; }
		location = /openapi.json { proxy_pass http://$api_upstream; }
		location = /.well-known/openapi.json { proxy_pass http://$api_upstream; }
		location /api/ {
			rewrite ^/api/(.*)$ /$1 break;
			proxy_pass http://$api_upstream;
		}
		location /ipfs/ { proxy_pass http://$api_upstream; }
	}
}
